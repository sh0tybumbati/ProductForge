services:
  # Frontend (React + Vite)
  - type: web
    name: productforge-frontend
    env: static
    staticPublishPath: ./client/dist
    buildCommand: cd client && npm install && npm run build
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # Backend (Node.js + Express + Prisma)
  - type: web
    name: productforge-backend
    env: node
    plan: starter
    buildCommand: cd server && npm install && npm run build && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: productforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # Database (PostgreSQL)
databases:
  - name: productforge-db
    databaseName: productforge
    user: productforge